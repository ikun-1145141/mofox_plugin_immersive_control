[project]
name = "mofox-plugin-immersive-control"
version = "1.2.1"
description = "Neo-MoFox 沉浸式控制插件"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".reference", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
